<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FinHope — Your AI Financial Brain</title>
<meta name="description" content="AI-powered personal finance app grounded in your real income, expenses, loans, and goals." />

<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#0B1F1C" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FinHope" />

<style>
  html, body { margin: 0; padding: 0; background: #0B1F1C; }
  #root { min-height: 100vh; }
  #boot-screen {
    position: fixed; inset: 0; background: #0B1F1C; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    font-family: system-ui, sans-serif; color: #7CE6B8; z-index: 9999;
  }
  #boot-screen .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid #254741; border-top-color: #7CE6B8;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot-error { color: #E8593D; font-family: system-ui, sans-serif; padding: 24px; text-align: center; }
</style>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18",
    "react-dom/client": "https://esm.sh/react-dom@18/client",
    "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18,react-dom@18"
  }
}
</script>
</head>
<body>

<div id="boot-screen">
  <div class="spinner"></div>
  <div>Loading FinHope…</div>
</div>
<div id="root"></div>

<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="module">
  async function boot() {
    try {
      const res = await fetch("./app.jsx");
      if (!res.ok) throw new Error("Could not load app.jsx (status " + res.status + ")");
      const source = await res.text();

      const bootstrap = `
import { createRoot } from "react-dom/client";
${source}
const _root = createRoot(document.getElementById("root"));
_root.render(<FinHope />);
`;

      const { code } = Babel.transform(bootstrap, {
        presets: [["react", { runtime: "automatic" }]],
        filename: "app.jsx",
      });

      const blob = new Blob([code], { type: "text/javascript" });
      const url = URL.createObjectURL(blob);
      await import(url);

      document.getElementById("boot-screen").remove();
    } catch (err) {
      console.error("FinHope failed to load:", err);
      const boot = document.getElementById("boot-screen");
      boot.innerHTML = '<div id="boot-error">FinHope couldn\\'t load.<br/>' + (err && err.message ? err.message : "Unknown error") +
        '<br/><br/>If you opened this file directly, host it (Netlify/Vercel) instead — fetch() of local files is blocked by the browser otherwise.</div>';
    }
  }
  boot();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>

</body>
</html>
